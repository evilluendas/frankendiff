# Runs the pipeline tests and the HTML snapshot check on every PR and on trunk.
name: Tests

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
